    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FormAI is an AI-powered form builder. Describe what you need, and let AI generate dynamic, validated forms instantly — no code required." />

    <script>
      // Prevent dark mode flash on page load
      ;(function () {
        var stored = localStorage.getItem('vueuse-color-scheme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
